name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  # Run tests and static analysis
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: library_db
          MYSQL_USER: library_user
          MYSQL_PASSWORD: library_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, pdo_mysql
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Run database migrations
        run: php artisan migrate --force --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: library_db
          DB_USERNAME: library_user
          DB_PASSWORD: library_pass

      - name: Seed database
        run: php artisan db:seed --force --no-interaction

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-filter=app
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: library_db
          DB_USERNAME: library_user
          DB_PASSWORD: library_pass

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (code style)
        run: vendor/bin/pint --test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Security audit
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit (Composer)
        run: composer audit --no-interaction --format=plain

  # Deploy to production (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-progress --no-interaction
          npm install --ignore-scripts
          npm run build

      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          script: |
            cd /var/www/librarysystem
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm install --ignore-scripts
            npm run build
            php artisan migrate --force --no-interaction
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo supervisorctl restart all
            php artisan pail:clear
        env:
          APP_ENV: production
          APP_DEBUG: false

      - name: Notify deployment success
        if: success()
        run: echo "Deployment to production completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment to production failed!"