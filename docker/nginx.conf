# =====================================================================
# Nginx — Library Management System (production)
#
# Public entry point. Serves the built React/Vite assets and proxies PHP
# to the PHP-FPM container over the Docker network at app:9000.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    # Enable HSTS only once HTTPS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root directory (Laravel public)
    root /var/www/html/public;
    index index.php index.html;

    # Upload size (matches php.ini upload_max_filesize)
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed Vite build assets aggressively (immutable)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve uploaded files (covers, QR codes) via the storage symlink
    location /storage/ {
        try_files $uri =404;
    }

    # Handle Laravel routing (SPA fallback + API)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP-FPM (separate container on the Docker network)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|lock|sql)$ {
        deny all;
    }

    # Access and error logs
    access_log /var/log/nginx/library-access.log;
    error_log /var/log/nginx/library-error.log;
}