# =====================================================================
# Docker Compose — Library Management System (PRODUCTION)
#
# Architecture:
#   Internet → nginx (public HTTP 80) → app (PHP-FPM, internal 9000)
#                                        ├── mysql (internal 3306)
#                                        └── redis (internal 6379)
#
# Secrets are NOT hardcoded. Copy docker/.env.example to .env and set
# real values (especially DB_PASSWORD, DB_ROOT_PASSWORD, APP_KEY).
#
# HTTPS can be added later with real certificates and a production domain.
# For local development with hot-reload, use the native `composer dev` workflow.
# =====================================================================

services:
  # ---------- Laravel PHP-FPM ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-app
    restart: unless-stopped
    # PHP-FPM is internal only — no host port published.
    expose:
      - "9000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-library_db}
      DB_USERNAME: ${DB_USERNAME:-library_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Library System}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
    volumes:
      # Shared public dir so Nginx can serve built assets + storage symlink
      - laravel_public:/var/www/html/public
      # Shared uploads dir (book covers, QR codes) written by app, read by Nginx
      - laravel_storage:/var/www/html/storage/app/public
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - library-network
    healthcheck:
      # PHP-FPM is not an HTTP server; verify its master process is running.
      test: ["CMD-SHELL", "ps | grep '[p]hp-fpm: master process' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- Nginx (public entry point) ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: library-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Same shared public dir as the app container
      - laravel_public:/var/www/html/public:ro
      # Same shared uploads dir so the public/storage symlink resolves
      - laravel_storage:/var/www/html/storage/app/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- MySQL (internal only) ----------
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    # Not exposed to the host by default.
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-library_db}
      MYSQL_USER: ${DB_USERNAME:-library_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Redis (internal only) ----------
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    # Not exposed to the host by default.
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  laravel_public:
    driver: local
  laravel_storage:
    driver: local

networks:
  library-network:
    driver: bridge
